<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>FUKUIFILM | Projetos</title>

  <meta name="description"
    content="fukuifilm é uma agência de marketing e direção visual focada em presença de marca, publicidade, filmes e portfólio autoral." />

  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0b0b0b" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="fukuifilm" />
  <meta property="og:description"
    content="Marketing, publicidade e direção visual com presença, memória e sofisticação." />
  <meta property="og:locale" content="pt_BR" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Oswald:wght@400&display=swap"
    rel="stylesheet" />

  <!-- LOGO -->
  <link rel="preload" href="img/FUKUIFILM-HORIZONTAL-BRANCO.png" as="image">

  <!-- PROJETOS -->
  <link rel="preload" href="img/foto1tortinha.jpeg" as="image">
  <link rel="preload" href="img/foto2.jpg" as="image">
  <link rel="preload" href="img/foto3.jpeg" as="image">
  <link rel="preload" href="img/foto4.jpeg" as="image">

  <!-- FILMES -->
  <link rel="preload" href="img/cadafalsohorizontal.jpg" as="image">
  <link rel="preload" href="img/etrehorizontal.png" as="image">

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="icon" type="image/png" href="img/ico.ico" />
</head>

<body>
  <nav class="floating-menu">

    <div class="menu-contents">

      <!-- LOGO ESQUERDA -->
      <a href="index.html" class="menu-brand">
        <img src="img/FUKUIFILM-HORIZONTAL-BRANCO.png" alt="FUKUIFILM" class="menu-logo" loading="eager">
      </a>

      <!-- MENU CENTRO -->
      <ul id="main-navigation">
        <li><a href="index.html">Início</a></li>
        <li><a href="#projects-section">Projetos</a></li>
        <li><a href="#films-section">Em foco</a></li>
      </ul>

      <!-- DIREITA -->
      <div class="menu-right">

        <a href="https://www.instagram.com/fukuifilm/" target="_blank" class="menu-instagram">
          <i class="fab fa-instagram"></i>
        </a>

        <a class="budget-btn" href="https://wa.me/5547999988082" target="_blank">
          Solicitar orçamento
        </a>

      </div>

    </div>

  </nav>

  <main>
    <section id="projects-section" class="projects-page">

      <div class="projects-page-title">
        <h1>
          PROJETOS EM<br>
          DESTAQUE
        </h1>
      </div>

      <div class="projects-red-frame">

        <div class="projects-grid-custom">

          <button class="project-card" data-project="1">
            <span class="project-name">Tortinha Café</span>
            <img src="img/foto1tortinha.jpeg" alt="Projeto 1" loading="eager">
          </button>

          <button class="project-card" data-project="2">
            <span class="project-name">Campanha Verão</span>
            <img src="img/foto2.jpg" alt="Projeto 2" loading="eager">
          </button>

          <button class="project-card" data-project="3">
            <span class="project-name">Editorial Fashion</span>
            <img src="img/foto3.jpeg" alt="Projeto 3" loading="eager">
          </button>

          <button class="project-card" data-project="4">
            <span class="project-name">Publicidade Food</span>
            <img src="img/foto4.jpeg" alt="Projeto 4" loading="eager">
          </button>

          <button class="project-card" data-project="5">
            <span class="project-name">Projeto 05</span>
            <img src="img/foto1tortinha.jpeg" alt="Projeto 5" loading="eager">
          </button>

          <button class="project-card" data-project="6">
            <span class="project-name">Projeto 06</span>
            <img src="img/foto2.jpg" alt="Projeto 6" loading="eager">
          </button>

          <button class="project-card" data-project="7">
            <span class="project-name">Projeto 07</span>
            <img src="img/foto3.jpeg" alt="Projeto 7" loading="eager">
          </button>

          <button class="project-card" data-project="8">
            <span class="project-name">Projeto 08</span>
            <img src="img/foto4.jpeg" alt="Projeto 8" loading="eager">
          </button>

        </div>

      </div>

    </section>

    <section id="films-section" class="films-section">

      <div class="films-header">
        <h2>
          FILMES PRODUZIDOS<br>
          PELA FUKUIFILM<span>.</span>
        </h2>
      </div>

      <div class="films-gallery">

        <div class="film-block">

          <img src="img/cadafalsohorizontal.jpg" alt="Cadafalso" loading="eager">

          <button class="film-btn" data-film="cadafalso">
            SOBRE O FILME
          </button>

        </div>

        <div class="film-block etre-img">

          <img src="img/etrehorizontal.png" alt="ÊTRE" class="etre-img" loading="eager">

          <button class="film-btn" data-film="etre">
            SOBRE O FILME
          </button>

        </div>

      </div>

    </section>

    <!-- MODAL DOS FILMES -->

    <div class="film-modal">

      <div class="film-modal-content">

        <button class="film-close">
          &times;
        </button>

        <div class="film-gallery">
          <img id="film-image-1" src="" alt="">
          <img id="film-image-2" src="" alt="">
          <img id="film-image-3" src="" alt="">
          <img id="film-image-4" src="" alt="">
        </div>

        <h3 id="film-title"></h3>

        <p id="film-description"></p>

      </div>

    </div>

    <!-- MODAL -->

    <div class="project-modal">

      <button class="close-modal">
        &times;
      </button>

      <button class="gallery-arrow prev-arrow">
        &#10094;
      </button>

      <img id="modal-image" src="" alt="" loading="eager">

      <button class="gallery-arrow next-arrow">
        &#10095;
      </button>

    </div>

  </main>

  <footer class="site-footer">
    <p>© 2026 FUKUIFILM. Todos os direitos reservados.</p>
  </footer>
  <script src="projetos.js"></script>

</body>

</html>
